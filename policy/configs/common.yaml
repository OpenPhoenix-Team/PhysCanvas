# Historical Pi0.5 GRPO settings, with the public final PhysCanvas WM backend.
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

cluster:
  num_nodes: 2
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:PHYSCANVAS_ROOT}/outputs/grpo
    project_name: physcanvas_pi05_grpo
    experiment_name: ${task}_public_epoch30_step300_pi05
    logger_backends: [tensorboard]
  max_epochs: 500
  max_steps: 500
  only_eval: false
  val_check_interval: -1
  save_interval: 4
  resume_dir: null
  ckpt_path: null

algorithm:
  adv_type: grpo
  group_size: 8
  reward_coef: 1.0
  normalize_advantages: true
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  loss_type: actor
  loss_agg_func: token-mean
  update_epoch: 1
  gamma: 0.99
  gae_lambda: 0.95
  kl_penalty: kl
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  filter_rewards: true
  rewards_lower_bound: 0.125
  rewards_upper_bound: 0.875

env:
  group_name: EnvGroup
  train:
    # Retain RLinf's registered action/environment contract; backend is new.
    env_type: jimu_wm
    wm_env_type: arx
    total_num_envs: 128
    seed: 2026
    group_size: ${algorithm.group_size}
    auto_reset: false
    ignore_terminations: false
    rollout_epoch: 4
    max_policy_chunks: 16
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    action_horizon: 16
    wm_sub_frames: 8
    action_dim: 14
    prompt: ${task_prompt}
    world_model:
      backend: physcanvas
      source_root: ${oc.env:PHYSCANVAS_ROOT}/vendor/PhysCanvas
      public_config: ${oc.env:PHYSCANVAS_ROOT}/vendor/PhysCanvas/evaluation/data/public_eval_config.json
      checkpoint: ${oc.env:PHYSCANVAS_ASSETS}/weights/epoch30_step300/transformer
      pretrained_vae: ${oc.env:VAE_PATH}
      prompt_embedding: ${oc.env:PROMPT_EMBEDDING}
      reset_cache: ${oc.env:RESET_CACHE}
      selection_manifest: ${oc.env:RESET_SELECTION}
      task: ${task_wm_id}
      dtype: bfloat16
      num_inference_steps: 30
      tactile_flow_encoding: xyz_linear
      tactile_flow_linear_max_disp: 0.06
      tactile_third_channel: xyz
      renderer:
        settings_file: ${oc.env:MOTION_SETTINGS}
    reward_model:
      checkpoint: ${oc.env:RM_CHECKPOINT}
      threshold: 0.7
      batch_size: 256
      output_type: label
    use_rel_reward: ${task_use_rel_reward}
    reward_coef: ${algorithm.reward_coef}
    trajectory_reward_aggregation: ${task_reward_aggregation}
    terminate_on_rm_success: true
    skip_terminated_wm_rollouts: true
    policy_tactile_mode: enabled
    policy_temporal_mode: pi05_single_frame
    enable_offload: true
    rollout_visualization:
      enabled: true
      worker_ranks: [0, 1, 2]
      sample_env_index: 0
      every_updates: 1
      fps: 10
      motion_background: 190
      strict: true
      output_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/rollout_visualizations
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    # Explicit copy, not an alias that can mutate training config.
    env_type: ${env.train.env_type}
    wm_env_type: ${env.train.wm_env_type}
    total_num_envs: ${env.train.total_num_envs}
    seed: ${env.train.seed}
    group_size: ${env.train.group_size}
    auto_reset: false
    ignore_terminations: false
    rollout_epoch: 1
    max_policy_chunks: ${env.train.max_policy_chunks}
    max_episode_steps: ${env.train.max_episode_steps}
    max_steps_per_rollout_epoch: ${env.train.max_steps_per_rollout_epoch}
    action_horizon: ${env.train.action_horizon}
    wm_sub_frames: ${env.train.wm_sub_frames}
    action_dim: ${env.train.action_dim}
    prompt: ${env.train.prompt}
    world_model: ${env.train.world_model}
    reward_model: ${env.train.reward_model}
    use_rel_reward: ${env.train.use_rel_reward}
    reward_coef: ${env.train.reward_coef}
    trajectory_reward_aggregation: ${env.train.trajectory_reward_aggregation}
    terminate_on_rm_success: true
    skip_terminated_wm_rollouts: true
    policy_tactile_mode: enabled
    policy_temporal_mode: pi05_single_frame
    enable_offload: true
    is_eval: true
    rollout_visualization:
      enabled: false
    video_cfg: ${env.train.video_cfg}

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 128
  seed: 42
  enable_offload: true
  model:
    model_path: ${oc.env:PI05_CHECKPOINT}
    model_type: openpi_rlinf
    precision: bf16
    is_lora: false
    lora_rank: 32
    use_proprio: true
    pi05: true
    num_action_chunks: 16
    action_dim: 14
    num_steps: 10
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_arx_wm_grpo
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      discrete_state_input: true
      max_token_len: 200
      num_images_in_input: 3
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      num_steps: ${..num_steps}
      noise_method: flow_sde
      noise_level: ${task_noise_level}
      joint_logprob: false
      ignore_last: false
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: false
      train_expert_only: true
      hold_gt_until_state_move: true
      state_move_threshold: 0.001
      hold_gt_max_policy_chunks: 4
      use_tactile: true
      tactile_num_sensors: 4
      tactile_points_per_sensor: 700
      tactile_input_channels: 3
      tactile_grid_height: 35
      tactile_grid_width: 20
      tactile_hidden_dim: 1024
      tactile_gate_init: 0.01
    openpi_data:
      norm_stats_path: ${oc.env:PI05_NORM_STATS}
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: false
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728

reward:
  use_reward_model: false
critic:
  use_critic_model: false
